name: Atualizar catálogo C7Drop

on:
  schedule:
    - cron: "17 */2 * * *" # a cada 2 horas
  workflow_dispatch: {} # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: c7drop-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar dados da C7Drop e regenerar o arquivo
        run: node scripts/update-c7drop-catalog.mjs

      - name: Commit e push (só se mudou)
        run: |
          if git diff --quiet -- src/data/c7drop-products.ts; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/data/c7drop-products.ts
          git commit -m "chore(c7drop): catálogo atualizado automaticamente"
          git pull --rebase origin main
          git push origin HEAD:main
